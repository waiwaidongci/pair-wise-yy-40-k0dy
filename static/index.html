<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>建筑抗震鉴定与加固排序</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem;margin-right:.5rem}</style></head><body><h1>建筑抗震鉴定与加固排序</h1><p>依据结构、用途、人员密度和历史缺陷生成鉴定与加固优先级</p><p>加固方案须引用已关闭评估事项，经评审委员会同意后方可进入设计；方案换版或评估事项补改，原同意立即失效，已进施工的不倒退。</p><button onclick="loadItems()">刷新项目</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>async function loadItems(){const r=await fetch('/api/items',{headers:{'X-Actor':'demo','X-Role':'viewer'}});const data=await r.json();const slim=(data.items||[]).map(i=>({id:i.id,status:i.status,reinforcement:i.reinforcement}));document.getElementById('out').textContent=JSON.stringify(slim,null,2)}</script></body></html>
